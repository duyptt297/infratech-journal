<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="epoxyGloss" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <pattern id="concretePatt" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#64748b"/>
      <circle cx="12" cy="12" r="2" fill="#475569"/>
      <circle cx="10" cy="2" r="1" fill="#334155"/>
    </pattern>
  </defs>

  <rect width="500" height="400" fill="#090d16" rx="12"/>

  <!-- Layer Build-up Perspective -->
  <!-- Layer 1: Concrete Substrate (Bê tông mác 250-350) -->
  <rect x="60" y="240" width="380" height="100" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
  <rect x="60" y="240" width="380" height="100" fill="url(#concretePatt)"/>
  <text x="80" y="290" fill="#94a3b8" font-family="monospace" font-size="12" font-weight="bold">BÊ TÔNG CỐT SÀN (ĐỘ ẨM &lt; 4% - MÀI SHOT-BLASTING)</text>

  <!-- Layer 2: Epoxy Penetrating Primer (Sơn lót thẩm thấu) -->
  <rect x="60" y="215" width="380" height="25" fill="#0369a1" stroke="#0284c7" stroke-width="1"/>
  <text x="80" y="232" fill="#e0f2fe" font-family="monospace" font-size="10" font-weight="bold">LỚP LÓT EPOXY PENETRATING PRIMER (BÁM DÍNH &gt; 2.5 MPa)</text>

  <!-- Layer 3: Epoxy Mortar / Silica Sand Middle Layer -->
  <rect x="60" y="170" width="380" height="45" fill="#075985" stroke="#38bdf8" stroke-width="1"/>
  <text x="80" y="196" fill="#bae6fd" font-family="monospace" font-size="10" font-weight="bold">VỮA TỰ SAN PHẲNG TRUNG GIAN GIA CƯỜNG CÁT THẠCH ANH (1.5mm)</text>

  <!-- Layer 4: Mirror-Finish Self-Leveling Topcoat (2.0mm - 3.0mm) -->
  <rect x="60" y="130" width="380" height="40" fill="url(#epoxyGloss)" stroke="#00f0ff" stroke-width="2"/>
  <!-- Gloss reflection streak -->
  <polygon points="120,130 220,130 180,170 80,170" fill="#ffffff" fill-opacity="0.3"/>
  <polygon points="280,130 380,130 340,170 240,170" fill="#ffffff" fill-opacity="0.2"/>
  <text x="80" y="155" fill="#090d16" font-family="monospace" font-size="12" font-weight="bold">LỚP PHỦ EPOXY TỰ PHẲNG NGUYÊN KHỐI (BÓNG GƯƠNG 95%)</text>

  <!-- Heavy Forklift 15-Ton Load Arrow -->
  <path d="M 400 50 L 400 115 M 390 100 L 400 115 L 410 100" stroke="#f59e0b" stroke-width="3" fill="none"/>
  <text x="320" y="75" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">15-TON FORKLIFT</text>
  <text x="320" y="90" fill="#fcd34d" font-family="sans-serif" font-size="10">Compressive 75 MPa</text>

  <!-- Title Badge -->
  <rect x="20" y="20" width="180" height="26" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8"/>
  <text x="28" y="37" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">ISO 14644 / ASTM C881</text>
</svg>
