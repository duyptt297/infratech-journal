<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="brassSpk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <linearGradient id="redFluid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
  </defs>

  <rect width="500" height="400" fill="#090d16" rx="12"/>

  <!-- Sprinkler Thread Nipple -->
  <rect x="220" y="40" width="60" height="50" rx="3" fill="url(#brassSpk)" stroke="#ca8a04" stroke-width="2"/>
  <line x1="220" y1="52" x2="280" y2="52" stroke="#713f12" stroke-width="2"/>
  <line x1="220" y1="64" x2="280" y2="64" stroke="#713f12" stroke-width="2"/>
  <line x1="220" y1="76" x2="280" y2="76" stroke="#713f12" stroke-width="2"/>

  <!-- Hex Wrench Shoulder -->
  <polygon points="205,90 295,90 285,115 215,115" fill="url(#brassSpk)" stroke="#ca8a04" stroke-width="2"/>

  <!-- Frame Twin Arms (Looping down) -->
  <path d="M 215 115 C 200 160, 200 240, 240 270 L 260 270 C 300 240, 300 160, 285 115" fill="none" stroke="url(#brassSpk)" stroke-width="12" stroke-linecap="round"/>

  <!-- Sealing Assembly (Teflon spring plug) -->
  <rect x="238" y="115" width="24" height="15" rx="2" fill="#e2e8f0" stroke="#94a3b8"/>

  <!-- Glass Bulb Outer Shell -->
  <rect x="244" y="130" width="12" height="100" rx="6" fill="#f8fafc" fill-opacity="0.3" stroke="#38bdf8" stroke-width="1.5"/>
  <!-- Thermo Sensitive Fluid Column (Red 68C) -->
  <rect x="246" y="135" width="8" height="90" rx="4" fill="url(#redFluid)"/>
  <!-- Air bubble in bulb -->
  <circle cx="250" cy="150" r="3" fill="#ffffff" fill-opacity="0.8"/>

  <!-- Deflector Plate (Umbrella) -->
  <rect x="210" y="275" width="80" height="8" rx="2" fill="url(#brassSpk)" stroke="#ca8a04" stroke-width="1.5"/>
  <!-- Teeth / Prongs of deflector -->
  <polygon points="210,283 205,305 215,305" fill="url(#brassSpk)"/>
  <polygon points="225,283 222,310 230,310" fill="url(#brassSpk)"/>
  <polygon points="245,283 245,315 255,315 255,283" fill="url(#brassSpk)"/>
  <polygon points="270,283 270,310 278,310" fill="url(#brassSpk)"/>
  <polygon points="290,283 285,305 295,305" fill="url(#brassSpk)"/>

  <!-- Water Spray Cone Pattern Simulation (Blue dashed curves) -->
  <path d="M 250 285 Q 120 340 50 390" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4,4" fill="none" opacity="0.6"/>
  <path d="M 250 285 Q 380 340 450 390" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4,4" fill="none" opacity="0.6"/>
  <path d="M 250 285 Q 180 350 150 390" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4,4" fill="none" opacity="0.6"/>
  <path d="M 250 285 Q 320 350 350 390" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="4,4" fill="none" opacity="0.6"/>

  <!-- Annotation Lines -->
  <line x1="280" y1="65" x2="380" y2="65" stroke="#eab308" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="390" y="70" fill="#eab308" font-family="monospace" font-size="11" font-weight="bold">1/2" NPT THREAD</text>

  <line x1="256" y1="180" x2="380" y2="180" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="390" y="175" fill="#ef4444" font-family="monospace" font-size="11" font-weight="bold">RED BULB (68°C)</text>
  <text x="390" y="190" fill="#94a3b8" font-family="sans-serif" font-size="10">RTI &lt; 50 (m.s)^0.5</text>

  <line x1="290" y1="290" x2="380" y2="290" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="390" y="295" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">DEFLECTOR (TÁN NƯỚC)</text>

  <!-- Title Badge -->
  <rect x="20" y="20" width="180" height="26" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444"/>
  <text x="28" y="37" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">NFPA 13 / UL &amp; FM LISTED</text>
</svg>
