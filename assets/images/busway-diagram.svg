<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="alHousing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="cuBar" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <rect width="500" height="400" fill="#090d16" rx="12"/>

  <!-- Busway Sandwich Cross Section Isometric-ish View -->
  <!-- Top Extruded Aluminum Shell with Heatsink Fins -->
  <path d="M 60 120 L 400 120 L 440 160 L 100 160 Z" fill="url(#alHousing)" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Heatsink ribs on top -->
  <line x1="120" y1="120" x2="160" y2="160" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="180" y1="120" x2="220" y2="160" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="240" y1="120" x2="280" y2="160" stroke="#cbd5e1" stroke-width="1.5"/>
  <line x1="300" y1="120" x2="340" y2="160" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- 4 Copper Phase Bars clamped in sandwich -->
  <!-- L1 Bar -->
  <path d="M 110 165 L 140 165 L 140 260 L 110 260 Z" fill="url(#cuBar)" stroke="#d97706" stroke-width="1"/>
  <text x="118" y="220" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">L1</text>

  <!-- Mylar Sheet 1 -->
  <rect x="141" y="165" width="4" height="95" fill="#38bdf8" fill-opacity="0.8"/>

  <!-- L2 Bar -->
  <path d="M 147 165 L 177 165 L 177 260 L 147 260 Z" fill="url(#cuBar)" stroke="#d97706" stroke-width="1"/>
  <text x="155" y="220" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">L2</text>

  <!-- Mylar Sheet 2 -->
  <rect x="178" y="165" width="4" height="95" fill="#38bdf8" fill-opacity="0.8"/>

  <!-- L3 Bar -->
  <path d="M 184 165 L 214 165 L 214 260 L 184 260 Z" fill="url(#cuBar)" stroke="#d97706" stroke-width="1"/>
  <text x="192" y="220" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">L3</text>

  <!-- Mylar Sheet 3 -->
  <rect x="215" y="165" width="4" height="95" fill="#38bdf8" fill-opacity="0.8"/>

  <!-- Neutral Bar (100% or 200%) -->
  <path d="M 221 165 L 251 165 L 251 260 L 221 260 Z" fill="#0284c7" stroke="#0369a1" stroke-width="1"/>
  <text x="232" y="220" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">N</text>

  <!-- Longitudinal extension of bars -->
  <path d="M 251 165 L 420 165 L 420 230 L 251 230 Z" fill="#b45309" fill-opacity="0.4"/>

  <!-- Bottom Aluminum Shell -->
  <path d="M 60 265 L 400 265 L 440 305 L 100 305 Z" fill="url(#alHousing)" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Twin-headed Torque Shear Bolt -->
  <circle cx="340" cy="215" r="14" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <polygon points="340,205 348,210 348,220 340,225 332,220 332,210" fill="#f87171"/>
  <text x="360" y="218" fill="#f87171" font-family="monospace" font-size="10" font-weight="bold">70 N.m SHEAR BOLT</text>

  <!-- Annotations -->
  <line x1="125" y1="260" x2="125" y2="340" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="90" y="360" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">ĐỒNG NGUYÊN KHỐI 99.9%</text>

  <line x1="216" y1="260" x2="260" y2="340" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="270" y="345" fill="#38bdf8" font-family="monospace" font-size="11" font-weight="bold">CÁCH ĐIỆN MYLAR CLASS F</text>

  <line x1="260" y1="120" x2="260" y2="60" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="200" y="50" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="bold">VỎ NHÔM TẢN NHIỆT (IP54 / IP66)</text>

  <!-- Title Badge -->
  <rect x="20" y="20" width="160" height="26" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8"/>
  <text x="28" y="37" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">IEC 61439-6 / UL 857</text>
</svg>
