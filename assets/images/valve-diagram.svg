<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="brassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.3"/>
    </linearGradient>
  </defs>

  <!-- Background Grid -->
  <rect width="500" height="400" fill="#090d16" rx="12"/>
  <path d="M 0 50 L 500 50 M 0 100 L 500 100 M 0 150 L 500 150 M 0 200 L 500 200 M 0 250 L 500 250 M 0 300 L 500 300 M 0 350 L 500 350" stroke="#1e293b" stroke-width="0.7" stroke-dasharray="4,4"/>
  <path d="M 50 0 L 50 400 M 100 0 L 100 400 M 150 0 L 150 400 M 200 0 L 200 400 M 250 0 L 250 400 M 300 0 L 300 400 M 350 0 L 350 400 M 400 0 L 400 400 M 450 0 L 450 400" stroke="#1e293b" stroke-width="0.7" stroke-dasharray="4,4"/>

  <!-- Valve Pipeline Flow Line -->
  <rect x="50" y="240" width="400" height="80" rx="4" fill="url(#bodyGrad)" stroke="#475569" stroke-width="2"/>
  <rect x="50" y="255" width="400" height="50" fill="#0284c7" fill-opacity="0.15"/>
  <path d="M 80 280 L 180 280 M 165 270 L 180 280 L 165 290" stroke="#00f0ff" stroke-width="2.5" fill="none"/>
  <path d="M 320 280 L 420 280 M 405 270 L 420 280 L 405 290" stroke="#00f0ff" stroke-width="2.5" fill="none"/>

  <!-- Flanges (Left & Right) -->
  <rect x="40" y="210" width="25" height="140" rx="4" fill="#1e293b" stroke="#00f0ff" stroke-width="1.5"/>
  <circle cx="52" cy="230" r="5" fill="#090d16" stroke="#64748b"/>
  <circle cx="52" cy="330" r="5" fill="#090d16" stroke="#64748b"/>

  <rect x="435" y="210" width="25" height="140" rx="4" fill="#1e293b" stroke="#00f0ff" stroke-width="1.5"/>
  <circle cx="447" cy="230" r="5" fill="#090d16" stroke="#64748b"/>
  <circle cx="447" cy="330" r="5" fill="#090d16" stroke="#64748b"/>

  <!-- Central Bonnet Tower -->
  <path d="M 195 240 L 210 140 L 290 140 L 305 240 Z" fill="url(#bodyGrad)" stroke="#64748b" stroke-width="2"/>
  <rect x="200" y="130" width="100" height="15" rx="3" fill="#334155" stroke="#94a3b8"/>

  <!-- Yoke Frame -->
  <path d="M 215 130 L 225 60 L 275 60 L 285 130 Z" fill="none" stroke="#64748b" stroke-width="3"/>

  <!-- Acme Rising Stem -->
  <rect x="246" y="30" width="8" height="180" fill="url(#brassGrad)" stroke="#d97706" stroke-width="1"/>
  <!-- Stem Threads -->
  <line x1="246" y1="45" x2="254" y2="43" stroke="#78350f" stroke-width="1"/>
  <line x1="246" y1="55" x2="254" y2="53" stroke="#78350f" stroke-width="1"/>
  <line x1="246" y1="65" x2="254" y2="63" stroke="#78350f" stroke-width="1"/>
  <line x1="246" y1="75" x2="254" y2="73" stroke="#78350f" stroke-width="1"/>

  <!-- Handwheel (Top Red) -->
  <ellipse cx="250" cy="28" rx="75" ry="14" fill="#dc2626" stroke="#ef4444" stroke-width="2"/>
  <ellipse cx="250" cy="28" rx="60" ry="10" fill="#991b1b"/>
  <circle cx="250" cy="28" r="8" fill="#f8fafc"/>
  <line x1="190" y1="28" x2="310" y2="28" stroke="#f8fafc" stroke-width="2"/>

  <!-- Wedge Disc (Bottom Gate) -->
  <polygon points="230,240 270,240 265,300 235,300" fill="url(#brassGrad)" stroke="#f59e0b" stroke-width="1.5"/>

  <!-- Engineering Annotation Callouts -->
  <line x1="310" y1="28" x2="370" y2="28" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="375" y="32" fill="#ef4444" font-family="monospace" font-size="11" font-weight="bold">HANDWHEEL (VÔ LĂNG)</text>

  <line x1="254" y1="80" x2="360" y2="80" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="365" y="84" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">ACME STEM (TY REN)</text>

  <line x1="300" y1="160" x2="380" y2="160" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="385" y="164" fill="#94a3b8" font-family="monospace" font-size="11" font-weight="bold">BONNET &amp; GLAND</text>

  <line x1="268" y1="270" x2="370" y2="270" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="375" y="274" fill="#00f0ff" font-family="monospace" font-size="11" font-weight="bold">FLEXIBLE WEDGE (ĐĨA CHÊM)</text>

  <!-- Title Badge -->
  <rect x="20" y="20" width="160" height="26" rx="4" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff"/>
  <text x="28" y="37" fill="#00f0ff" font-family="sans-serif" font-size="11" font-weight="bold">ASME B16.34 / API 600</text>
</svg>
