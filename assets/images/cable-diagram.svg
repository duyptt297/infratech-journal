<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="mica" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <linearGradient id="xlpe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="armor" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <linearGradient id="lszh" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <rect width="500" height="400" fill="#090d16" rx="12"/>

  <!-- Stepped Peeling Cable Diagram -->
  <!-- Layer 5: Orange LSZH Outer Jacket -->
  <path d="M 40 120 L 160 120 L 160 280 L 40 280 Z" fill="url(#lszh)" stroke="#ea580c" stroke-width="2"/>
  <text x="50" y="150" fill="#ffffff" font-family="monospace" font-size="11" font-weight="bold">LSZH SHEATH</text>

  <!-- Layer 4: Steel Wire Armor (SWA) -->
  <path d="M 160 135 L 240 135 L 240 265 L 160 265 Z" fill="url(#armor)" stroke="#94a3b8" stroke-width="1.5"/>
  <!-- Armor wires vertical lines -->
  <line x1="175" y1="135" x2="175" y2="265" stroke="#334155" stroke-width="3"/>
  <line x1="190" y1="135" x2="190" y2="265" stroke="#334155" stroke-width="3"/>
  <line x1="205" y1="135" x2="205" y2="265" stroke="#334155" stroke-width="3"/>
  <line x1="220" y1="135" x2="220" y2="265" stroke="#334155" stroke-width="3"/>

  <!-- Layer 3: XLPE Insulation -->
  <path d="M 240 150 L 320 150 L 320 250 L 240 250 Z" fill="url(#xlpe)" stroke="#16a34a" stroke-width="1.5"/>

  <!-- Layer 2: Mica Fire Tape -->
  <path d="M 320 165 L 390 165 L 390 235 L 320 235 Z" fill="url(#mica)" stroke="#eab308" stroke-width="1.5"/>
  <!-- Mica overlapping tape spirals -->
  <line x1="330" y1="165" x2="350" y2="235" stroke="#a16207" stroke-width="1.5"/>
  <line x1="350" y1="165" x2="370" y2="235" stroke="#a16207" stroke-width="1.5"/>
  <line x1="370" y1="165" x2="390" y2="235" stroke="#a16207" stroke-width="1.5"/>

  <!-- Layer 1: Pure Copper Stranded Core -->
  <path d="M 390 178 L 460 178 L 460 222 L 390 222 Z" fill="url(#copper)" stroke="#d97706" stroke-width="2"/>
  <!-- Strands -->
  <line x1="390" y1="190" x2="460" y2="190" stroke="#78350f" stroke-width="1"/>
  <line x1="390" y1="200" x2="460" y2="200" stroke="#78350f" stroke-width="1"/>
  <line x1="390" y1="210" x2="460" y2="210" stroke="#78350f" stroke-width="1"/>

  <!-- Callout Annotations -->
  <line x1="430" y1="178" x2="430" y2="90" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="400" y="80" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold">1. RUỘT ĐỒNG CLASS 2</text>

  <line x1="355" y1="165" x2="355" y2="60" stroke="#fef08a" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="320" y="50" fill="#fef08a" font-family="monospace" font-size="11" font-weight="bold">2. BĂNG MICA 950°C</text>

  <line x1="280" y1="150" x2="280" y2="340" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="240" y="360" fill="#22c55e" font-family="monospace" font-size="11" font-weight="bold">3. CÁCH ĐIỆN XLPE</text>

  <line x1="200" y1="265" x2="200" y2="340" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="160" y="360" fill="#cbd5e1" font-family="monospace" font-size="11" font-weight="bold">4. GIÁP THÉP SWA</text>

  <line x1="100" y1="280" x2="100" y2="340" stroke="#ea580c" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="60" y="360" fill="#ea580c" font-family="monospace" font-size="11" font-weight="bold">5. VỎ LSZH CHẬM CHÁY</text>

  <!-- Fire Rating Badge -->
  <rect x="20" y="20" width="180" height="26" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444"/>
  <text x="28" y="37" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">IEC 60331 / BS 6387 CWZ</text>
</svg>
