<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="cylinderRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </linearGradient>
  </defs>

  <rect width="500" height="400" fill="#090d16" rx="12"/>

  <!-- High Pressure Steel Cylinder -->
  <rect x="180" y="100" width="140" height="230" rx="20" fill="url(#cylinderRed)" stroke="#f87171" stroke-width="2"/>
  <!-- Welded Skirt Base -->
  <rect x="175" y="320" width="150" height="30" rx="4" fill="#334155" stroke="#64748b"/>

  <!-- Valve Assembly on Top -->
  <rect x="230" y="55" width="40" height="45" rx="4" fill="#64748b" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Solenoid Electric Actuator -->
  <rect x="270" y="50" width="35" height="25" rx="3" fill="#f59e0b" stroke="#d97706"/>
  <text x="275" y="66" fill="#0f172a" font-family="monospace" font-size="8" font-weight="bold">SOLENOID</text>

  <!-- Pressure Gauge -->
  <circle cx="215" cy="70" r="14" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <!-- Gauge needle at 25 bar green zone -->
  <path d="M 207 68 A 8 8 0 0 1 223 68" fill="none" stroke="#22c55e" stroke-width="3"/>
  <line x1="215" y1="70" x2="220" y2="65" stroke="#dc2626" stroke-width="1.5"/>

  <!-- Flexible Discharge Hose & 360-deg Nozzle -->
  <path d="M 250 55 C 250 30, 370 30, 370 80 L 370 140" fill="none" stroke="#94a3b8" stroke-width="6"/>
  <!-- 360 Degree Radial Nozzle -->
  <polygon points="360,140 380,140 375,155 365,155" fill="#f59e0b" stroke="#d97706"/>

  <!-- Gas Discharge Cloud Effect -->
  <circle cx="370" cy="180" r="25" fill="#00f0ff" fill-opacity="0.1" stroke="#00f0ff" stroke-dasharray="2,2"/>
  <text x="350" y="225" fill="#00f0ff" font-family="monospace" font-size="10" font-weight="bold">DISCHARGE ≤ 10s</text>

  <!-- Cylinder Label -->
  <rect x="195" y="150" width="110" height="80" rx="4" fill="#090d16" fill-opacity="0.85" stroke="#f59e0b"/>
  <text x="205" y="172" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="bold">FM-200</text>
  <text x="205" y="188" fill="#ffffff" font-family="sans-serif" font-size="9">HFC-227ea CLEAN AGENT</text>
  <text x="205" y="202" fill="#94a3b8" font-family="sans-serif" font-size="9">Pressure: 25 / 42 Bar</text>
  <text x="205" y="216" fill="#22c55e" font-family="sans-serif" font-size="9">NOAEL: 9.0% Safe for Human</text>

  <!-- Callouts -->
  <line x1="160" y1="70" x2="200" y2="70" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="50" y="74" fill="#22c55e" font-family="monospace" font-size="10" font-weight="bold">PRESSURE GAUGE (25 BAR)</text>

  <rect x="20" y="20" width="180" height="26" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444"/>
  <text x="28" y="37" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">NFPA 2001 / ISO 14520</text>
</svg>
