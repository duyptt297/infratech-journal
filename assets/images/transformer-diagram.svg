<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="epoxyCoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <linearGradient id="coreSilicon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <rect width="500" height="400" fill="#090d16" rx="12"/>

  <!-- Magnetic Core Frame (Silicon Steel Lamination) -->
  <rect x="70" y="80" width="360" height="240" rx="8" fill="none" stroke="url(#coreSilicon)" stroke-width="26"/>

  <!-- 3 Cast Resin Coils (Phases U, V, W) -->
  <!-- Phase U -->
  <rect x="95" y="110" width="80" height="180" rx="14" fill="url(#epoxyCoil)" stroke="#f87171" stroke-width="2"/>
  <rect x="110" y="130" width="50" height="140" rx="8" fill="#7f1d1d"/>
  <text x="130" y="205" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold">U</text>

  <!-- Phase V -->
  <rect x="210" y="110" width="80" height="180" rx="14" fill="url(#epoxyCoil)" stroke="#f87171" stroke-width="2"/>
  <rect x="225" y="130" width="50" height="140" rx="8" fill="#7f1d1d"/>
  <text x="245" y="205" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold">V</text>

  <!-- Phase W -->
  <rect x="325" y="110" width="80" height="180" rx="14" fill="url(#epoxyCoil)" stroke="#f87171" stroke-width="2"/>
  <rect x="340" y="130" width="50" height="140" rx="8" fill="#7f1d1d"/>
  <text x="360" y="205" fill="#f8fafc" font-family="monospace" font-size="14" font-weight="bold">W</text>

  <!-- Top High Voltage Bushings & Terminals -->
  <rect x="125" y="55" width="20" height="30" fill="#f59e0b" rx="3"/>
  <rect x="240" y="55" width="20" height="30" fill="#f59e0b" rx="3"/>
  <rect x="355" y="55" width="20" height="30" fill="#f59e0b" rx="3"/>

  <!-- Forced Air Cooling Fans on the bottom -->
  <rect x="100" y="325" width="70" height="20" rx="4" fill="#0284c7"/>
  <text x="115" y="339" fill="#ffffff" font-family="sans-serif" font-size="10">FAN +40%</text>

  <rect x="215" y="325" width="70" height="20" rx="4" fill="#0284c7"/>
  <text x="230" y="339" fill="#ffffff" font-family="sans-serif" font-size="10">FAN +40%</text>

  <rect x="330" y="325" width="70" height="20" rx="4" fill="#0284c7"/>
  <text x="345" y="339" fill="#ffffff" font-family="sans-serif" font-size="10">FAN +40%</text>

  <!-- Class E2 C2 F1 Badge -->
  <rect x="20" y="20" width="180" height="26" rx="4" fill="#ef4444" fill-opacity="0.15" stroke="#ef4444"/>
  <text x="28" y="37" fill="#ef4444" font-family="sans-serif" font-size="11" font-weight="bold">IEC 60076-11 (E2-C2-F1)</text>

  <!-- Callouts -->
  <text x="280" y="42" fill="#f59e0b" font-family="monospace" font-size="10" font-weight="bold">22kV HV TERMINALS</text>
  <text x="70" y="375" fill="#94a3b8" font-family="monospace" font-size="10">ĐÚC CHÂN KHÔNG EPOXY CLASS F (155°C)</text>
</svg>
