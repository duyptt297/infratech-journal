<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="pirCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <pattern id="closedCells" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="3" fill="#ca8a04" fill-opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="500" height="400" fill="#090d16" rx="12"/>

  <!-- Top Steel Skin (0.5mm Galvalume prepainted) -->
  <rect x="60" y="100" width="380" height="15" rx="2" fill="#cbd5e1" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="70" y="90" fill="#38bdf8" font-family="monospace" font-size="10" font-weight="bold">TÔN MẠ KHÁNG KHUẨN PVDF 0.5mm</text>

  <!-- PIR Foam Core (Closed Cell 95%) -->
  <rect x="60" y="115" width="380" height="150" fill="url(#pirCore)" stroke="#eab308" stroke-width="1"/>
  <rect x="60" y="115" width="380" height="150" fill="url(#closedCells)"/>

  <!-- Z-Lock / Cam-lock Joint on the right side -->
  <path d="M 440 100 L 460 100 L 460 180 L 440 180 Z" fill="#94a3b8" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="360" y="200" fill="#0f172a" font-family="monospace" font-size="11" font-weight="bold">NGÀM Z-LOCK ÂM DƯƠNG</text>

  <!-- Bottom Steel Skin -->
  <rect x="60" y="265" width="380" height="15" rx="2" fill="#cbd5e1" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Thermal Performance Banner -->
  <rect x="100" y="140" width="220" height="50" rx="6" fill="#090d16" fill-opacity="0.85" stroke="#f59e0b"/>
  <text x="115" y="162" fill="#f59e0b" font-family="monospace" font-size="12" font-weight="bold">λ = 0.021 W/m.K</text>
  <text x="115" y="178" fill="#94a3b8" font-family="sans-serif" font-size="10">Closed-Cell Foam &gt; 95%</text>

  <!-- Fire Rating Marker -->
  <rect x="100" y="200" width="220" height="40" rx="6" fill="#090d16" fill-opacity="0.85" stroke="#ef4444"/>
  <text x="115" y="222" fill="#ef4444" font-family="monospace" font-size="11" font-weight="bold">FIRE CLASS B-s1, d0</text>
  <text x="115" y="235" fill="#94a3b8" font-family="sans-serif" font-size="10">Zero Flaming Droplets</text>

  <!-- Thickness indicator -->
  <line x1="40" y1="100" x2="40" y2="280" stroke="#00f0ff" stroke-width="1.5"/>
  <line x1="35" y1="100" x2="45" y2="100" stroke="#00f0ff" stroke-width="1.5"/>
  <line x1="35" y1="280" x2="45" y2="280" stroke="#00f0ff" stroke-width="1.5"/>
  <text x="25" y="195" fill="#00f0ff" font-family="monospace" font-size="11" font-weight="bold" transform="rotate(-90 25 195)">75 - 150 mm</text>

  <rect x="20" y="20" width="180" height="26" rx="4" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8"/>
  <text x="28" y="37" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="bold">FM 4880 / EN 13501-1</text>
</svg>
